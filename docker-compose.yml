# Optional: run API + frontend dev servers in containers. Supabase stays hosted (or use `supabase start`).
services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    env_file: ./backend/.env
    command: sh -c "pip install -q -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --reload"
    ports: ["8000:8000"]
  web:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    env_file: ./frontend/.env
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
